name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gesture logic is pure Python: the tests need neither a camera, Qt nor MediaPipe.
      - run: pip install numpy pytest ruff
      - run: ruff check gesture_player tests scripts
      - run: pytest -q
